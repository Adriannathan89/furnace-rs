[package]
name = "furnace-storage-renamed"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
flame = { package = "furnace-rs", path = "../../../../furnace-rs", default-features = false }
storage_lib = { package = "furnace-rs-persistence", path = "../../..", default-features = false, features = ["sea-orm-storage"] }
sea-orm = { version = "=2.0.3", default-features = false, features = ["macros"] }
sea-orm-macros = "=2.0.3"
