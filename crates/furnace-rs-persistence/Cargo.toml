[package]
name = "furnace-rs-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Native persistence connectors for furnace-rs applications"

[[example]]
name = "standard_run"
required-features = ["sea-orm-postgres"]

[[test]]
name = "security_benchmark"
required-features = ["sea-orm-postgres"]

[features]
default = []
sea-orm-postgres = [
    "dep:sea-orm",
    "dep:tracing",
    "sea-orm/macros",
    "sea-orm/sqlx-postgres",
    "sea-orm/runtime-tokio-rustls",
]

[dependencies]
furnace-rs-core = { path = "../furnace-rs-core", version = "=1.0.0" }
sea-orm = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
sea-orm = { workspace = true, features = ["mock", "runtime-tokio-rustls"] }
furnace-rs = { path = "../furnace-rs", version = "=1.0.0", default-features = false, features = ["http", "runtime-tokio"] }

[lints]
workspace = true
