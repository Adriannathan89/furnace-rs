[package]
name = "furnace-rs-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Protobuf-first gRPC serving and consumption for furnace-rs"
[features]
default = []
jwt = ["furnace-rs-common/passport"]
tls = ["tonic/tls-ring", "tonic/tls-webpki-roots"]
[dependencies]
furnace-rs-core = { path = "../furnace-rs-core", version = "=2.0.0-beta.1" }
furnace-rs-common = { path = "../furnace-rs-common", version = "=2.0.0-beta.1", default-features = false, features = ["transport-metadata"] }
furnace-rs-grpc-macros = { path = "../furnace-rs-grpc-macros", version = "=2.0.0-beta.1" }
heck = "0.5"
http.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["transport", "router", "codegen"] }
tonic-health.workspace = true
tonic-reflection.workspace = true
tower.workspace = true
[dev-dependencies]
furnace-grpc-test-support = { path = "../../tests/grpc-support" }
http-body.workspace = true
jsonwebtoken.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tonic-prost.workspace = true
[lints]
workspace = true
