[package]
name = "furnace-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
description = "Modular Rust application framework with Axum and Passport integrations"

[dependencies]
furnace-rs-socket = { path = "../furnace-rs-socket", version = "=2.0.0", optional = true }
furnace-rs-grpc = { path = "../furnace-rs-grpc", version = "=2.0.0", optional = true }
furnace-rs-common = { path = "../furnace-rs-common", version = "=2.0.0", optional = true, default-features = false }
furnace-rs-core = { path = "../furnace-rs-core", version = "=2.0.0" }
furnace-rs-extra = { path = "../furnace-rs-extra", version = "=2.0.0", optional = true }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite = "0.29"
furnace-grpc-test-support = { path = "../../tests/grpc-support" }
furnace-rs-testing = { path = "../furnace-rs-testing", version = "=2.0.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
trybuild.workspace = true

[features]
socket = ["dep:furnace-rs-socket"]
socket-tls = ["socket", "furnace-rs-socket/tls"]
socket-redis = ["socket", "furnace-rs-socket/redis"]
grpc = ["dep:furnace-rs-grpc"]
grpc-tls = ["grpc", "furnace-rs-grpc/tls"]
default = ["common", "runtime-tokio"]
common = ["http", "logger"]
http = ["dep:furnace-rs-common", "furnace-rs-common/http"]
jwt = ["dep:furnace-rs-common", "furnace-rs-common/jwt", "furnace-rs-grpc?/jwt", "furnace-rs-socket?/jwt"]
cookies = ["http", "furnace-rs-common/cookies"]
sea-orm = ["http", "furnace-rs-common/sea-orm"]
sea-orm-storage = ["http", "furnace-rs-common/sea-orm-storage"]
logger = ["dep:furnace-rs-common", "furnace-rs-common/logger"]
password-hasher = ["dep:furnace-rs-common", "furnace-rs-common/password-hasher"]
runtime-tokio = ["furnace-rs-core/runtime-tokio"]
extra = ["dep:furnace-rs-extra"]

[lints]
workspace = true
