[package]
name = "furnace-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
reqwest = { version = "=0.13.4", default-features = false }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "=0.8.23"

[dev-dependencies]
futures-util = "0.3"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
