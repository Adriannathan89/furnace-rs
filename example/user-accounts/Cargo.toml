[package]
name = "furnace-rs-example-user-accounts"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
furnace-rs = { path = "../../crates/furnace-rs", version = "=2.0.0", default-features = false, features = ["http", "jwt", "password-hasher", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
furnace-rs-testing = { path = "../../crates/furnace-rs-testing", version = "=2.0.0" }
serde_json = "1"
